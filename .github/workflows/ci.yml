---
name: CI

on:
  push:
    branches:
      - master
      - 0.6.x
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        run:  |
          sudo apt-get install cmake liblzma-dev
      - name: Build
        run:  |
          mkdir build
          cd build
          cmake -DDEBIAN=1 -DMULTI_SEMANTICS=1 -DCMAKE_VERBOSE_MAKEFILE=TRUE ..
          make
      - name: Test
        run:  |
          cd build
          make test
